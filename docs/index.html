    <script>
        window.$docsify = {
            name: 'CS with AI',
            nameLink: { '/zh-cn/': '#/zh-cn/', '/': '#/' },
            themeColor: '#D7336C',
            loadSidebar: true,
            loadNavbar: true,
            relativePath: true,
            mergeNavbar: true,
            auto2top: true,
            topMargin: 80,
            maxLevel: 3,
            subMaxLevel: 0,
            skipLink: { '/zh-cn/': '跳到主要内容', '/': 'Skip to main content' },
            executeScript: false,
            // Docsify matches the resolved file URL, including the Pages base path.
            notFoundPage: { '.*/zh-cn/': 'zh-cn/404.md', '/': 'src/inc/404.md' },
            search: {
                paths: 'auto',
                depth: 4,
                maxAge: 3600000,
                namespace: 'cs-with-ai-bilingual-20261001',
                pathNamespaces: ['/zh-cn'],
                placeholder: { '/zh-cn/': '搜索课程与笔记', '/': 'Search courses and notes' },

            },
            toc: {
                scope: '.markdown-section',
                headings: 'h1, h2, h3, h4',
                title: 'On this page',
            },
            mermaidConfig: { querySelector: '.mermaid' },
            latex: {
                inlineMath: [['$', '$']],
                displayMath: [['$$', '$$']],
                customOptions: {
                    TeX: {
                        equationNumbers: { autoNumber: 'AMS' },
                        Macros: { diffd: '\\,\\mathrm d', diffop: 'D' },
                    },
                },
                overflowScroll: true,
            },
            plugins: [function (hook, vm) {
                hook.afterEach(function (html) {
                    var chinese = /^\/zh-cn(?:\/|$)/.test(vm.route.path);
                    if (vm.route.path === '/' || vm.route.path === '/zh-cn/') return html;
                    var home = chinese ? '#/zh-cn/' : '#/';
                    var label = chinese ? '返回首页' : 'Back to home';
                    return html + '<footer class="page-footer"><a href="' + home + '">' + label + '</a><span>CS with AI · Zach Gao</span></footer>';
                });
            }],
        };
    </script>
